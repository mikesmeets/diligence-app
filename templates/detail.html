<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ label }} — {{ project.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spin { animation: spin 1s linear infinite; display:inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .md h1 { font-size:1.5rem; font-weight:700; color:#111827; margin:1.75rem 0 .75rem; }
    .md h2 { font-size:1.25rem; font-weight:700; color:#111827; margin:1.5rem 0 .6rem; }
    .md h3 { font-size:1rem; font-weight:700; color:#374151; margin:1.25rem 0 .5rem; }
    .md p  { margin:.75rem 0; line-height:1.75; color:#1f2937; }
    .md ul, .md ol { margin:.75rem 0 .75rem 1.5rem; }
    .md ul { list-style:disc; } .md ol { list-style:decimal; }
    .md li { margin:.35rem 0; line-height:1.7; color:#1f2937; }
    .md code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.875em;
               background:#f3f4f6; padding:.1rem .3rem; border-radius:.25rem; }
    .md strong { font-weight:600; color:#111827; }
    .md hr { margin:1.5rem 0; border-color:#e5e7eb; }
    .md blockquote { border-left:3px solid #e5e7eb; padding-left:1rem; color:#4b5563; margin:.75rem 0; }
    /* Wrapper scrolls on narrow screens so a wide table can't stretch the page. */
    .md-table { overflow-x:auto; margin:1.25rem 0; }
    .md table { border-collapse:collapse; width:100%; font-size:.875rem; }
    .md th { text-align:left; font-weight:600; color:#374151; background:#f9fafb;
             border-bottom:2px solid #e5e7eb; padding:.5rem .75rem; white-space:nowrap; }
    .md td { border-bottom:1px solid #f3f4f6; padding:.45rem .75rem; color:#1f2937;
             font-variant-numeric:tabular-nums; }
    .md tbody tr:last-child td { border-bottom:0; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-gray-200 px-6 py-4">
  <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-4 min-w-0">
      <a href="/projects/{{ project.id }}" class="text-sm text-gray-500 hover:text-gray-700 transition-colors whitespace-nowrap">← {{ project.name }}</a>
      <div class="h-4 w-px bg-gray-200"></div>
      <div class="min-w-0">
        <h1 class="text-xl font-bold text-gray-900 tracking-tight truncate">{{ label }}</h1>
        <p class="text-xs text-gray-400 mt-0.5" id="generated-at"></p>
      </div>
    </div>
    <div class="flex gap-2 flex-shrink-0">
      <button id="gen-btn" onclick="generate()"
        class="px-3 py-2 text-sm font-medium text-blue-700 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 transition-colors">
        ✦ Regenerate
      </button>
      <button id="edit-btn" onclick="startEdit()"
        class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
        Edit
      </button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8 space-y-5">

  <!-- Summary -->
  <div class="bg-white rounded-xl border-l-4 border-blue-500 border-y border-r border-gray-200 p-5">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Summary</p>
    <p id="summary" class="text-gray-800 leading-relaxed"></p>
  </div>

  <!-- Full write-up -->
  <div class="bg-white rounded-xl border border-gray-200 p-6">
    <div id="view" class="md"></div>
    <div id="edit" class="hidden">
      <textarea id="ta" rows="28"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono leading-relaxed resize-y outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      <div class="flex gap-2 mt-3">
        <button onclick="saveEdit()"
          class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Save</button>
        <button onclick="cancelEdit()"
          class="px-3 py-1.5 text-xs font-medium text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
        <span id="edit-status" class="text-xs text-gray-400 self-center"></span>
      </div>
    </div>
  </div>

  <p class="text-xs text-gray-300 leading-relaxed px-1">
    Drafted by Claude from the project's details and its Yahoo Finance tearsheet. Treat it as
    a starting point to argue with — verify the figures before you rely on any of them.
  </p>

</main>

<script>
const PROJECT_ID = {{ project.id }};
const FIELD      = {{ field | tojson }};
const LABEL      = {{ label | tojson }};

let summary   = {{ (project[field] or '') | tojson }};
let detail    = {{ (project[field ~ '_detail'] or '') | tojson }};
let generated = {{ (project[field ~ '_generated_at'] or '') | tojson }};

function escHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Small Markdown subset — headings, lists, quotes, rules, bold/italic/code.
// Everything is escaped first, so model output can't inject markup.
function renderMd(src) {
  const inline = (t) => escHtml(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

  // Figures get right-aligned even when the model omits alignment markers,
  // which it usually does — a column of left-ragged numbers is unreadable.
  const NUMERIC = /^[-+(]?\s*[$€£]?\s*\d[\d,]*(\.\d+)?\s*(%|x|bps|bn|mm|tn|k)?\s*\)?$/i;
  const cells = (row) =>
    row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l || '');
  const isSep = (l) => /^\s*\|[\s:|-]*-[\s:|-]*\|\s*$/.test(l || '');

  const lines = String(src ?? '').split('\n');
  const out = [];
  let list = null, para = [];

  const flushPara = () => {
    if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; }
  };
  const flushList = () => {
    if (list) { out.push(`</${list}>`); list = null; }
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trimEnd();

    // GFM table: a header row followed by a |---|---| separator.
    if (isRow(line) && isSep(lines[i + 1])) {
      flushPara(); flushList();
      const head  = cells(line);
      const align = cells(lines[i + 1]).map(s =>
        /^:-+:$/.test(s) ? 'center' : /^-+:$/.test(s) ? 'right'
        : /^:-+$/.test(s) ? 'left'  : null);
      i += 1;

      const body = [];
      while (isRow(lines[i + 1])) body.push(cells(lines[++i]));

      // Resolve one alignment per column so the header sits over its own
      // figures. Explicit markers win; otherwise a column of numbers goes right.
      const colAlign = head.map((_, n) => {
        if (align[n]) return align[n];
        const vals = body.map(r => r[n]).filter(v => v !== undefined && v !== '');
        return vals.length && vals.every(v => NUMERIC.test(v)) ? 'right' : null;
      });
      const style = (n) => colAlign[n] ? ` style="text-align:${colAlign[n]}"` : '';

      const th = head.map((h, n) => `<th${style(n)}>${inline(h)}</th>`).join('');
      const tr = body.map(r =>
        '<tr>' + r.map((c, n) => `<td${style(n)}>${inline(c)}</td>`).join('') + '</tr>'
      ).join('');

      out.push(`<div class="md-table"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`);
      continue;
    }

    if (!line.trim())                    { flushPara(); flushList(); continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }

    const q = line.match(/^>\s?(.*)$/);
    if (q) { flushPara(); flushList(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue; }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      const want = ul ? 'ul' : 'ol';
      if (list !== want) { flushList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${inline((ul || ol)[1])}</li>`);
      continue;
    }

    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  return out.join('\n');
}

function render() {
  document.getElementById('summary').innerHTML = summary
    ? escHtml(summary)
    : '<span class="text-gray-400">Nothing yet — hit Regenerate, or write it yourself.</span>';

  document.getElementById('view').innerHTML = detail
    ? renderMd(detail)
    : `<p class="text-gray-400 text-sm">No write-up yet. Generate one with Claude, or click Edit to write it yourself.</p>`;

  document.getElementById('generated-at').textContent =
    generated ? `Drafted ${new Date(generated).toLocaleString()}` : '';

  document.getElementById('gen-btn').textContent = detail ? '✦ Regenerate' : '✦ Generate';
}

// A timed-out generation comes back as an HTML page from the proxy, not JSON,
// so read the body as text and parse defensively.
async function readFailure(res) {
  const body = await res.text();
  let payload = null;
  try { payload = JSON.parse(body); } catch (e) { /* not JSON — proxy error page */ }

  if (payload && payload.error) return { message: payload.error };
  return { message: `Server error ${res.status}.` };
}

// Drafting runs server-side in the background; this just starts it and polls.
// Nothing holds a connection open, so the draft survives you closing the tab.
const POLL_MS      = 3000;
const POLL_GIVE_UP = 20 * 60 * 1000;

function setDrafting(on) {
  const btn = document.getElementById('gen-btn');
  btn.disabled = on;
  if (on) {
    btn.innerHTML = '<span class="spin">✦</span> Drafting…';
    document.getElementById('generated-at').textContent =
      'Drafting — this can take a few minutes. Safe to leave this page.';
  } else {
    btn.textContent = detail ? '✦ Regenerate' : '✦ Generate';
  }
}

async function generate() {
  if (detail && !confirm(`Replace the current ${LABEL.toLowerCase()} with a fresh draft?`)) return;

  setDrafting(true);
  try {
    const res = await fetch(`/api/projects/${PROJECT_ID}/generate/${FIELD}`, { method: 'POST' });
    if (!res.ok) {
      setDrafting(false);
      render();
      alert((await readFailure(res)).message);
      return;
    }
    pollGeneration();
  } catch (e) {
    setDrafting(false);
    render();
    alert(`Could not reach the server: ${e.message}`);
  }
}

async function pollGeneration() {
  const started = Date.now();
  while (Date.now() - started < POLL_GIVE_UP) {
    await new Promise(r => setTimeout(r, POLL_MS));

    let s;
    try {
      const res = await fetch(`/api/projects/${PROJECT_ID}/generation/${FIELD}`);
      if (!res.ok) continue;          // transient — keep waiting
      s = await res.json();
    } catch (e) {
      continue;                        // dropped connection — keep waiting
    }

    if (s.status === 'running') continue;

    if (s.status === 'done') {
      summary   = s.summary   || '';
      detail    = s.detail    || '';
      generated = s.generated_at || '';
    }
    setDrafting(false);
    render();
    if (s.status === 'error') alert(s.error || 'Generation failed.');
    return;
  }
  setDrafting(false);
  render();
  alert('Still drafting after 20 minutes. It may yet finish — reload the page to check.');
}

function startEdit() {
  document.getElementById('view').classList.add('hidden');
  document.getElementById('edit').classList.remove('hidden');
  document.getElementById('edit-btn').classList.add('hidden');
  const ta = document.getElementById('ta');
  ta.value = detail;
  ta.focus();
}

function cancelEdit() {
  document.getElementById('edit').classList.add('hidden');
  document.getElementById('view').classList.remove('hidden');
  document.getElementById('edit-btn').classList.remove('hidden');
  document.getElementById('edit-status').textContent = '';
}

async function saveEdit() {
  const status = document.getElementById('edit-status');
  status.textContent = 'Saving…';
  const res = await fetch(`/api/projects/${PROJECT_ID}/notes`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ [`${FIELD}_detail`]: document.getElementById('ta').value }),
  });
  if (!res.ok) { status.textContent = 'Failed to save'; return; }
  const saved = await res.json();
  detail = saved[`${FIELD}_detail`] || '';
  render();
  cancelEdit();
}

render();

// A draft may already be running from a previous visit — pick it back up.
(async () => {
  try {
    const res = await fetch(`/api/projects/${PROJECT_ID}/generation/${FIELD}`);
    if (res.ok && (await res.json()).status === 'running') {
      setDrafting(true);
      pollGeneration();
    }
  } catch (e) { /* offline — nothing to resume */ }
})();
</script>
</body>
</html>
