<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diligence App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spin { animation: spin 1s linear infinite; display:inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .truncate-thesis { max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header class="bg-white border-b border-gray-200 px-6 py-4">
  <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Diligence App</h1>
      <nav class="flex gap-4 mt-1.5">
        <a href="/" class="text-sm font-semibold text-gray-900 border-b-2 border-blue-600 pb-0.5">Collected Ideas</a>
        <a href="/projects" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">Projects</a>
        <a href="/inbox" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">Inbox</a>
        <a href="/admin" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">Admin</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <span id="last-refreshed" class="text-xs text-gray-400"></span>
      <button id="refresh-btn" onclick="refreshPrices()"
        class="hidden px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
        ↻ Refresh Prices
      </button>
      <button onclick="openModal()"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
        + Add Idea
      </button>
    </div>
  </div>
</header>

<!-- ── Stats bar ──────────────────────────────────────────────────────── -->
<div id="stats-bar" class="hidden bg-white border-b border-gray-100 px-6 py-2.5">
  <div class="max-w-screen-2xl mx-auto flex gap-8 text-sm text-gray-500" id="stats-content"></div>
</div>

<!-- ── Table ──────────────────────────────────────────────────────────── -->
<main class="max-w-screen-2xl mx-auto px-6 py-8">

  <!-- Filter bar -->
  <div id="filter-bar" class="hidden mb-4 flex flex-wrap gap-3 items-center">
    <input id="filter-search" type="text" placeholder="Search ticker or thesis…"
      oninput="filterTicker=this.value.trim().toLowerCase(); render()"
      class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 w-56" />

    <div class="flex rounded-lg overflow-hidden border border-gray-300 text-sm">
      <button id="dir-all"   onclick="setDir('all')"   class="px-3 py-1.5 font-medium">All</button>
      <button id="dir-long"  onclick="setDir('long')"  class="px-3 py-1.5 font-medium border-l border-gray-300">Long</button>
      <button id="dir-short" onclick="setDir('short')" class="px-3 py-1.5 font-medium border-l border-gray-300">Short</button>
    </div>

    <select id="filter-asset" onchange="filterAsset=this.value; render()"
      class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
      <option value="all">All Asset Classes</option>
      <option value="public_equity">Public Equity</option>
      <option value="private_equity">Private Equity</option>
      <option value="bond">Bond</option>
      <option value="real_estate">Real Estate</option>
    </select>

    <button onclick="clearFilters()" id="clear-filters-btn"
      class="hidden text-xs text-gray-400 hover:text-gray-600 underline">Clear filters</button>
    <span id="filter-count" class="hidden text-xs text-gray-400"></span>
  </div>

  <div id="table-container"></div>
</main>

<!-- ── Manage Sources Modal ───────────────────────────────────────────── -->
<div id="sources-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm">
    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900">Manage Sources</h2>
      <button onclick="closeManageSources()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-4 space-y-3">
      <div class="flex gap-2">
        <input id="new-source-mgmt" type="text" placeholder="New source name…"
          class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        <button onclick="addSourceFromMgmt()"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Add</button>
      </div>
      <ul id="sources-list" class="divide-y divide-gray-100 max-h-60 overflow-y-auto rounded-lg border border-gray-200"></ul>
    </div>
  </div>
</div>

<!-- ── Manage Idea Types Modal ────────────────────────────────────────── -->
<div id="idea-types-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm">
    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900">Manage Idea Types</h2>
      <button onclick="closeManageIdeaTypes()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-4 space-y-3">
      <div class="flex gap-2">
        <input id="new-idea-type-mgmt" type="text" placeholder="New idea type name…"
          class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        <button onclick="addIdeaTypeFromMgmt()"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Add</button>
      </div>
      <ul id="idea-types-list" class="divide-y divide-gray-100 max-h-60 overflow-y-auto rounded-lg border border-gray-200"></ul>
    </div>
  </div>
</div>

<!-- ── Manage Subtypes Modal ──────────────────────────────────────────── -->
<div id="subtypes-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm">
    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900">Manage Sub-types</h2>
      <button onclick="closeManageSubtypes()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-4 space-y-3">
      <div class="flex gap-2">
        <input id="new-subtype-mgmt" type="text" placeholder="New sub-type name…"
          class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        <button onclick="addSubtypeFromMgmt()"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Add</button>
      </div>
      <ul id="subtypes-list" class="divide-y divide-gray-100 max-h-60 overflow-y-auto rounded-lg border border-gray-200"></ul>
    </div>
  </div>
</div>

<!-- ── Add Idea Modal ─────────────────────────────────────────────────── -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between sticky top-0 bg-white z-10">
      <h2 id="modal-title" class="text-lg font-semibold text-gray-900">Add Investment Idea</h2>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <form id="idea-form" onsubmit="submitIdea(event)" class="px-6 py-5 space-y-4">

      <!-- Asset Class -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Asset Class</label>
        <select id="f-asset-class" onchange="onAssetClassChange()"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
          <option value="public_equity">Public Equity</option>
          <option value="private_equity">Private Equity</option>
          <option value="bond">Bond</option>
          <option value="real_estate">Real Estate</option>
        </select>
      </div>

      <!-- Ticker + Direction -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ticker / Name</label>
          <input id="f-ticker" type="text" autocomplete="off" onblur="onTickerBlur()"
            oninput="this.value=this.value.toUpperCase()"
            placeholder="e.g. AAPL"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          <p id="err-ticker" class="hidden text-red-500 text-xs mt-1"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Direction</label>
          <div class="flex gap-5 mt-2.5">
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="radio" name="direction" value="long" checked class="accent-blue-600" />
              <span class="text-sm font-medium">Long</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="radio" name="direction" value="short" class="accent-blue-600" />
              <span class="text-sm font-medium">Short</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Idea Date + Price -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Idea Date</label>
          <input id="f-idea-date" type="date" onblur="onIdeaDateBlur()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          <p id="err-idea-date" class="hidden text-red-500 text-xs mt-1"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1">
            Price on Idea Date
            <span id="loading-idea" class="hidden text-blue-500 text-xs spin">↻</span>
          </label>
          <div class="flex gap-1">
            <input id="f-idea-price" type="number" step="0.01" min="0"
              placeholder="Auto-fetched"
              class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" onclick="onIdeaDateBlur()" title="Refresh price"
              class="px-2 border border-gray-200 rounded-lg text-gray-400 hover:text-blue-600 hover:border-blue-300 transition-colors text-sm">↻</button>
          </div>
          <p id="err-idea-price" class="hidden text-red-500 text-xs mt-1"></p>
        </div>
      </div>

      <!-- Initial Date + Price -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Initial Tracking Date</label>
          <input id="f-initial-date" type="date" onblur="onInitialDateBlur()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          <p id="err-initial-date" class="hidden text-red-500 text-xs mt-1"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1">
            Price on Initial Date
            <span id="loading-initial" class="hidden text-blue-500 text-xs spin">↻</span>
          </label>
          <div class="flex gap-1">
            <input id="f-initial-price" type="number" step="0.01" min="0"
              placeholder="Auto-fetched"
              class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" onclick="onInitialDateBlur()" title="Refresh price"
              class="px-2 border border-gray-200 rounded-lg text-gray-400 hover:text-blue-600 hover:border-blue-300 transition-colors text-sm">↻</button>
          </div>
          <p id="err-initial-price" class="hidden text-red-500 text-xs mt-1"></p>
        </div>
      </div>

      <!-- Rating + Idea Type -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rating <span class="font-normal text-gray-400">(1–5, optional)</span></label>
          <input id="f-rating" type="number" min="1" max="5" step="0.5" placeholder="e.g. 3.5"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Idea Type <span class="font-normal text-gray-400">(optional)</span></label>
          <div class="flex gap-2">
            <select id="f-idea-type" onchange="onIdeaTypeChange()"
              class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="">— None —</option>
            </select>
            <button type="button" onclick="openManageIdeaTypes()"
              title="Manage idea types"
              class="px-2.5 border border-gray-200 rounded-lg text-gray-400 hover:text-blue-600 hover:border-blue-300 transition-colors text-sm">⚙</button>
          </div>
          <div id="new-idea-type-row" class="hidden mt-2 flex gap-2">
            <input id="f-new-idea-type" type="text" placeholder="New idea type name…"
              class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" onclick="saveNewIdeaType()"
              class="px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Add</button>
            <button type="button" onclick="cancelNewIdeaType()"
              class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700 transition-colors">✕</button>
          </div>
        </div>
      </div>

      <!-- Sub-type -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Sub-type <span class="font-normal text-gray-400">(optional)</span></label>
        <div class="flex gap-2">
          <select id="f-subtype" onchange="onSubtypeChange()"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">None</option>
          </select>
          <button type="button" onclick="openManageSubtypes()"
            title="Manage sub-types"
            class="px-2.5 border border-gray-200 rounded-lg text-gray-400 hover:text-blue-600 hover:border-blue-300 transition-colors text-sm">⚙</button>
        </div>
        <div id="new-subtype-row" class="hidden mt-2 flex gap-2">
          <input id="f-new-subtype" type="text" placeholder="New sub-type name…"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          <button type="button" onclick="saveNewSubtype()"
            class="px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Add</button>
          <button type="button" onclick="cancelNewSubtype()"
            class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700 transition-colors">✕</button>
        </div>
      </div>

      <!-- Source -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Source <span class="font-normal text-gray-400">(optional)</span></label>
        <div class="flex gap-2">
          <select id="f-source" onchange="onSourceChange()"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">No source</option>
          </select>
          <button type="button" onclick="openManageSources()"
            title="Manage sources"
            class="px-2.5 border border-gray-200 rounded-lg text-gray-400 hover:text-blue-600 hover:border-blue-300 transition-colors text-sm">⚙</button>
        </div>
        <div id="new-source-row" class="hidden mt-2 flex gap-2">
          <input id="f-new-source" type="text" placeholder="New source name…"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          <button type="button" onclick="saveNewSource()"
            class="px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Add</button>
          <button type="button" onclick="cancelNewSource()"
            class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700 transition-colors">✕</button>
        </div>
      </div>

      <!-- Hat Tip -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Hat Tip <span class="font-normal text-gray-400">(optional)</span></label>
        <select id="f-hat-tip"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          <option value="">None</option>
        </select>
      </div>

      <!-- Thesis -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Investment Thesis</label>
        <textarea id="f-thesis" rows="3"
          placeholder="Describe the investment thesis..."
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        <p id="err-thesis" class="hidden text-red-500 text-xs mt-1"></p>
      </div>

      <!-- Attachment -->
      <div class="border border-gray-200 rounded-lg p-3 space-y-2">
        <p class="text-sm font-medium text-gray-700">Attachment <span class="font-normal text-gray-400">(optional)</span></p>

        <!-- Shown only when editing and idea already has an attachment -->
        <div id="existing-attachment-strip" class="hidden flex items-center justify-between bg-gray-50 rounded-md px-3 py-2">
          <span id="existing-attachment-label" class="text-xs text-gray-600 truncate max-w-[260px]"></span>
          <label class="flex items-center gap-1.5 cursor-pointer select-none ml-3 flex-shrink-0">
            <input type="checkbox" id="clear-attachment" class="accent-red-500" />
            <span class="text-xs text-red-600">Remove</span>
          </label>
        </div>

        <div class="flex gap-4">
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input type="radio" name="attach-type" value="url" checked onchange="onAttachTypeChange()" class="accent-blue-600" />
            <span class="text-sm">URL</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input type="radio" name="attach-type" value="file" onchange="onAttachTypeChange()" class="accent-blue-600" />
            <span class="text-sm">File</span>
          </label>
        </div>
        <div id="attach-url-row">
          <input id="f-attachment-url" type="url" placeholder="https://..."
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div id="attach-file-row" class="hidden">
          <input id="f-attachment-file" type="file"
            class="w-full text-sm text-gray-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
          <p class="text-xs text-gray-400 mt-1">Max 20 MB. PDF, Word, Excel, images, etc.</p>
        </div>
      </div>

      <div class="flex gap-3 pt-1">
        <button type="button" onclick="closeModal()"
          class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
          Cancel
        </button>
        <button type="submit" id="submit-btn"
          class="flex-1 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-60 transition-colors">
          Add Idea
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ── JavaScript ─────────────────────────────────────────────────────── -->
<script>
const ASSET_LABELS = {
  public_equity:  'Public Equity',
  private_equity: 'Private Equity',
  bond:           'Bond',
  real_estate:    'Real Estate',
};

let ideas      = [];
let sources    = [];
let subtypes   = [];
let ideaTypes  = [];
let editingId  = null;

// ── Filter & sort state ───────────────────────────────────────────────────
let filterTicker    = '';
let filterDirection = 'all';
let filterAsset     = 'all';
let sortKey         = null;
let sortDir         = 1;   // 1 = asc, -1 = desc

function setDir(dir) {
  filterDirection = dir;
  render();
}

function clearFilters() {
  filterTicker    = '';
  filterDirection = 'all';
  filterAsset     = 'all';
  document.getElementById('filter-search').value = '';
  document.getElementById('filter-asset').value  = 'all';
  render();
}

function toggleSort(key) {
  if (sortKey === key) { sortDir = -sortDir; }
  else { sortKey = key; sortDir = 1; }
  render();
}

function getSortVal(idea, key) {
  switch (key) {
    case 'ticker':              return idea.ticker;
    case 'direction':           return idea.direction;
    case 'asset_class':         return ASSET_LABELS[idea.asset_class] || idea.asset_class;
    case 'idea_date':           return idea.idea_date;
    case 'idea_price':          return idea.idea_price;
    case 'initial_date':        return idea.initial_date;
    case 'initial_price':       return idea.initial_price;
    case 'current_price':       return idea.current_price;
    case 'change_idea_initial': {
      const {idea_price: f, initial_price: t} = idea;
      return (f && t) ? (t - f) / f * 100 : null;
    }
    case 'change_initial_today': {
      const {initial_price: f, current_price: t} = idea;
      return (f && t) ? (t - f) / f * 100 : null;
    }
    case 'change_idea_current': {
      const {idea_price: f, current_price: t} = idea;
      return (f && t) ? (t - f) / f * 100 : null;
    }
    case 'source_name':    return idea.source_name              || null;
    case 'hat_tip_name':  return idea.hat_tip_name             || null;
    case 'subtype_name':  return idea.subtype_name             || null;
    case 'rating':        return idea.rating                   ?? null;
    case 'idea_type':     return idea.idea_type_name || idea.idea_type || null;
    default: return null;
  }
}

function getFilteredSorted() {
  let result = ideas.filter(i => {
    if (filterTicker && !i.ticker.toLowerCase().includes(filterTicker) &&
        !i.thesis.toLowerCase().includes(filterTicker)) return false;
    if (filterDirection !== 'all' && i.direction !== filterDirection) return false;
    if (filterAsset !== 'all' && i.asset_class !== filterAsset) return false;
    return true;
  });

  if (sortKey) {
    result.sort((a, b) => {
      const av = getSortVal(a, sortKey);
      const bv = getSortVal(b, sortKey);
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });
  }

  return result;
}

function sortArrow(key) {
  if (sortKey !== key) return '<span class="opacity-0 group-hover:opacity-40 ml-0.5">↕</span>';
  return sortDir === 1
    ? '<span class="text-blue-500 ml-0.5">↑</span>'
    : '<span class="text-blue-500 ml-0.5">↓</span>';
}

function th(label, key, align = 'left') {
  const justify = align === 'right' ? 'justify-end' : '';
  return `<th class="px-4 py-3 text-${align} font-semibold">
    <button onclick="toggleSort('${key}')"
      class="inline-flex items-center ${justify} gap-0 hover:text-gray-700 whitespace-nowrap group w-full">
      ${label}${sortArrow(key)}
    </button>
  </th>`;
}

// ── Render ────────────────────────────────────────────────────────────────

function fmtPrice(p) {
  if (p == null) return '<span class="text-gray-400">—</span>';
  return `$${Number(p).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
}

function fmtChange(from, to, direction) {
  if (from == null || to == null) return '<span class="text-gray-400">—</span>';
  const pct = ((to - from) / from) * 100;
  const good = direction === 'long' ? pct >= 0 : pct <= 0;
  const cls = good ? 'text-green-600' : 'text-red-600';
  return `<span class="font-semibold ${cls}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span>`;
}

function render() {
  const filtered = getFilteredSorted();
  const hasIdeas  = ideas.length > 0;
  const isFiltered = filterTicker || filterDirection !== 'all' || filterAsset !== 'all';

  // Stats bar
  const statsBar   = document.getElementById('stats-bar');
  const refreshBtn = document.getElementById('refresh-btn');
  if (hasIdeas) {
    statsBar.classList.remove('hidden');
    const longs  = ideas.filter(i => i.direction === 'long').length;
    const shorts = ideas.filter(i => i.direction === 'short').length;
    document.getElementById('stats-content').innerHTML =
      `<span><strong class="text-gray-800">${ideas.length}</strong> ideas</span>
       <span><strong class="text-green-600">${longs}</strong> long</span>
       <span><strong class="text-red-600">${shorts}</strong> short</span>`;
    if (ideas.some(i => i.asset_class === 'public_equity'))
      refreshBtn.classList.remove('hidden');
  } else {
    statsBar.classList.add('hidden');
    refreshBtn.classList.add('hidden');
  }

  // Filter bar visibility & direction pills
  document.getElementById('filter-bar').classList.toggle('hidden', !hasIdeas);
  ['all','long','short'].forEach(d => {
    const btn = document.getElementById(`dir-${d}`);
    const active = filterDirection === d;
    btn.className = `px-3 py-1.5 font-medium text-sm transition-colors ${d !== 'all' ? 'border-l border-gray-300' : ''}
      ${active ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`;
  });

  // Clear-filters button & count
  const clearBtn   = document.getElementById('clear-filters-btn');
  const countEl    = document.getElementById('filter-count');
  clearBtn.classList.toggle('hidden', !isFiltered);
  if (isFiltered) {
    countEl.textContent = `${filtered.length} of ${ideas.length} shown`;
    countEl.classList.remove('hidden');
  } else {
    countEl.classList.add('hidden');
  }

  // Table
  const container = document.getElementById('table-container');
  if (ideas.length === 0) {
    container.innerHTML = `
      <div class="text-center py-24 text-gray-400">
        <div class="text-5xl mb-4">📋</div>
        <p class="text-lg font-medium text-gray-500">No ideas yet</p>
        <p class="text-sm mt-1">Click "Add Idea" to start tracking investments.</p>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="text-center py-16 text-gray-400">
        <p class="text-base font-medium text-gray-500">No ideas match the current filters.</p>
        <button onclick="clearFilters()" class="mt-2 text-sm text-blue-600 hover:underline">Clear filters</button>
      </div>`;
    return;
  }

  const rows = filtered.map(idea => `
    <tr class="hover:bg-blue-50 transition-colors group cursor-pointer"
        onclick="window.location='/ideas/${idea.id}'">
      <td class="px-4 py-3 font-bold text-gray-900">${escHtml(idea.ticker)}</td>
      <td class="px-4 py-3">
        <span class="px-2 py-0.5 rounded-full text-xs font-semibold
          ${idea.direction === 'long' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
          ${idea.direction.toUpperCase()}
        </span>
      </td>
      <td class="px-4 py-3 text-gray-600 whitespace-nowrap">${ASSET_LABELS[idea.asset_class] || idea.asset_class}</td>
      <td class="px-4 py-3 text-gray-600 whitespace-nowrap">${idea.idea_date}</td>
      <td class="px-4 py-3 text-right font-mono text-gray-900">${fmtPrice(idea.idea_price)}</td>
      <td class="px-4 py-3 text-gray-600 whitespace-nowrap">${idea.initial_date}</td>
      <td class="px-4 py-3 text-right font-mono text-gray-900">${fmtPrice(idea.initial_price)}</td>
      <td class="px-4 py-3 text-right font-mono text-gray-900">${fmtPrice(idea.current_price)}</td>
      <td class="px-4 py-3 text-right">${fmtChange(idea.idea_price, idea.initial_price, idea.direction)}</td>
      <td class="px-4 py-3 text-right">${fmtChange(idea.initial_price, idea.current_price, idea.direction)}</td>
      <td class="px-4 py-3 text-right font-semibold">${fmtChange(idea.idea_price, idea.current_price, idea.direction)}</td>
      <td class="px-4 py-3 text-gray-600 whitespace-nowrap text-xs">${idea.idea_type_name || idea.idea_type ? escHtml(idea.idea_type_name || idea.idea_type) : '<span class="text-gray-400">—</span>'}</td>
      <td class="px-4 py-3 text-gray-600 whitespace-nowrap text-xs">${idea.subtype_name ? escHtml(idea.subtype_name) : '<span class="text-gray-400">—</span>'}</td>
      <td class="px-4 py-3 text-right font-mono text-gray-700 text-xs">${idea.rating != null ? idea.rating.toFixed(1) : '<span class="text-gray-400">—</span>'}</td>
      <td class="px-4 py-3 text-gray-600 whitespace-nowrap text-xs">
        ${idea.source_name ? escHtml(idea.source_name) : '<span class="text-gray-400">—</span>'}
      </td>
      <td class="px-4 py-3 text-gray-600 whitespace-nowrap text-xs">
        ${idea.hat_tip_name ? escHtml(idea.hat_tip_name) : '<span class="text-gray-400">—</span>'}
      </td>
      <td class="px-4 py-3 text-gray-600">
        <span class="truncate-thesis block" title="${escHtml(idea.thesis)}">${escHtml(idea.thesis)}</span>
      </td>
      <td class="px-4 py-3">${fmtAttachment(idea)}</td>
      <td class="px-4 py-3 whitespace-nowrap" onclick="event.stopPropagation()">
        <button onclick="promoteIdea(${idea.id}, '${escHtml(idea.ticker)}')"
          title="Start a project from this idea"
          class="text-gray-400 hover:text-blue-600 text-xs transition-colors mr-3">
          Promote
        </button>
        <button onclick="openEditModal(${idea.id})"
          class="text-gray-400 hover:text-blue-600 text-xs transition-colors mr-3">
          Edit
        </button>
        <button onclick="deleteIdea(${idea.id}, '${escHtml(idea.ticker)}')"
          class="text-gray-300 group-hover:text-gray-400 hover:!text-red-500 text-xs transition-colors">
          Delete

  container.innerHTML = `
    <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
      <table class="min-w-full bg-white text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200 text-xs uppercase tracking-wide text-gray-500">
            ${th('Ticker',          'ticker')}
            ${th('Dir',             'direction')}
            ${th('Asset Class',     'asset_class')}
            ${th('Idea Date',       'idea_date')}
            ${th('Idea Price',      'idea_price',          'right')}
            ${th('Initial Date',    'initial_date')}
            ${th('Initial Price',   'initial_price',       'right')}
            ${th('Current Price',   'current_price',       'right')}
            ${th('Idea → Initial',  'change_idea_initial', 'right')}
            ${th('Initial → Today', 'change_initial_today','right')}
            ${th('Idea → Current',  'change_idea_current', 'right')}
            ${th('Type',            'idea_type')}
            ${th('Sub-type',        'subtype_name')}
            ${th('Rating',          'rating', 'right')}
            ${th('Source',          'source_name')}

            <th class="px-4 py-3 text-left font-semibold">Attachment</th>

          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">${rows}</tbody>
      </table>
    </div>`;
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtAttachment(idea) {
  if (idea.attachment_name) {
    return `<a href="/api/ideas/${idea.id}/attachment" target="_blank"
      class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 text-xs whitespace-nowrap">
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
      </svg>
      <span class="truncate max-w-[120px]" title="${escHtml(idea.attachment_name)}">${escHtml(idea.attachment_name)}</span>
    </a>`;
  }
  if (idea.attachment_url) {
    let label;
    try { label = new URL(idea.attachment_url).hostname; } catch { label = idea.attachment_url; }
    return `<a href="${escHtml(idea.attachment_url)}" target="_blank" rel="noopener noreferrer"
      class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 text-xs whitespace-nowrap">
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
      <span class="truncate max-w-[120px]" title="${escHtml(idea.attachment_url)}">${escHtml(label)}</span>
    </a>`;
  }
  return '<span class="text-gray-400">—</span>';
}

// ── Modal ─────────────────────────────────────────────────────────────────

function onAttachTypeChange() {
  const isFile = document.querySelector('input[name="attach-type"]:checked').value === 'file';
  document.getElementById('attach-url-row').classList.toggle('hidden', isFile);
  document.getElementById('attach-file-row').classList.toggle('hidden', !isFile);
}

function _resetModal() {
  document.getElementById('f-idea-date').value     = '';
  document.getElementById('f-initial-date').value  = '';
  document.getElementById('f-ticker').value         = '';
  document.getElementById('f-idea-price').value     = '';
  document.getElementById('f-initial-price').value  = '';
  document.getElementById('f-thesis').value         = '';
  document.getElementById('f-attachment-url').value  = '';
  document.getElementById('f-attachment-file').value = '';
  document.getElementById('clear-attachment').checked = false;
  document.querySelector('input[name="direction"][value="long"]').checked = true;
  document.querySelector('input[name="attach-type"][value="url"]').checked  = true;
  document.getElementById('f-asset-class').value    = 'public_equity';
  document.getElementById('f-rating').value = '';
  populateIdeaTypeDropdown(null);
  document.getElementById('new-idea-type-row').classList.add('hidden');
  document.getElementById('f-new-idea-type').value = '';
  populateSubtypeDropdown(null);
  document.getElementById('new-subtype-row').classList.add('hidden');
  document.getElementById('f-new-subtype').value = '';
  populateSourceDropdown(null);
  populateHatTipDropdown(null);
  document.getElementById('new-source-row').classList.add('hidden');
  document.getElementById('f-new-source').value = '';
  document.getElementById('attach-url-row').classList.remove('hidden');
  document.getElementById('attach-file-row').classList.add('hidden');
  document.getElementById('existing-attachment-strip').classList.add('hidden');
  clearErrors();
}

function openModal() {
  editingId = null;
  _resetModal();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-idea-date').value    = today;
  document.getElementById('f-initial-date').value = today;
  document.getElementById('modal-title').textContent  = 'Add Investment Idea';
  document.getElementById('submit-btn').textContent   = 'Add Idea';
  document.getElementById('modal').classList.remove('hidden');
}

function openEditModal(id) {
  const idea = ideas.find(i => i.id === id);
  if (!idea) return;
  editingId = id;
  _resetModal();

  document.getElementById('f-ticker').value         = idea.ticker;
  document.getElementById('f-idea-date').value      = idea.idea_date;
  document.getElementById('f-idea-price').value     = idea.idea_price ?? '';
  document.getElementById('f-initial-date').value   = idea.initial_date;
  document.getElementById('f-initial-price').value  = idea.initial_price ?? '';
  document.getElementById('f-thesis').value         = idea.thesis;
  document.getElementById('f-asset-class').value    = idea.asset_class;
  document.querySelector(`input[name="direction"][value="${idea.direction}"]`).checked = true;
  document.getElementById('f-rating').value = idea.rating ?? '';
  populateIdeaTypeDropdown(idea.idea_type_id || null);
  populateSubtypeDropdown(idea.subtype_id || null);
  populateSourceDropdown(idea.source_id  || null);
  populateHatTipDropdown(idea.hat_tip_id || null);

  // Pre-populate attachment fields so they aren't blanked on save
  if (idea.attachment_url) {
    document.querySelector('input[name="attach-type"][value="url"]').checked = true;
    document.getElementById('f-attachment-url').value = idea.attachment_url;
    document.getElementById('attach-url-row').classList.remove('hidden');
    document.getElementById('attach-file-row').classList.add('hidden');
  } else if (idea.attachment_name) {
    document.querySelector('input[name="attach-type"][value="file"]').checked = true;
    document.getElementById('attach-url-row').classList.add('hidden');
    document.getElementById('attach-file-row').classList.remove('hidden');
  }

  // Show the existing-attachment strip so the user can see / remove it
  if (idea.attachment_name || idea.attachment_url) {
    const label = idea.attachment_name
      ? `📎 ${idea.attachment_name}`
      : `🔗 ${idea.attachment_url}`;
    document.getElementById('existing-attachment-label').textContent = label;
    document.getElementById('existing-attachment-strip').classList.remove('hidden');
  }

  document.getElementById('modal-title').textContent = 'Edit Idea';
  document.getElementById('submit-btn').textContent  = 'Save Changes';
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() {
  editingId = null;
  document.getElementById('modal').classList.add('hidden');
}

function clearErrors() {
  ['ticker','idea-date','initial-date','idea-price','initial-price','thesis']
    .forEach(f => { const el = document.getElementById(`err-${f}`); el.classList.add('hidden'); el.textContent=''; });
}

function showErr(field, msg) {
  const el = document.getElementById(`err-${field}`);
  el.textContent = msg;
  el.classList.remove('hidden');
}

function onAssetClassChange() {
  const isPublic = document.getElementById('f-asset-class').value === 'public_equity';
  ['f-idea-price','f-initial-price'].forEach(id => {
    document.getElementById(id).placeholder = isPublic ? 'Auto-fetched' : 'Optional';
  });
  document.getElementById('f-ticker').placeholder = isPublic ? 'e.g. AAPL' : 'e.g. Acme Corp';
  if (!isPublic) {
    document.getElementById('f-idea-price').value    = '';
    document.getElementById('f-initial-price').value = '';
  }
}

async function fetchPriceFromAPI(ticker, date) {
  const res = await fetch(`/api/stock-price?ticker=${encodeURIComponent(ticker)}&date=${encodeURIComponent(date)}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Failed to fetch');
  return data.price;
}

async function autoFetch(loaderId, priceFieldId, errFieldId, ticker, date) {
  if (!ticker || !date) return;
  if (document.getElementById('f-asset-class').value !== 'public_equity') return;
  const loader = document.getElementById(loaderId);
  loader.classList.remove('hidden');
  document.getElementById(errFieldId).classList.add('hidden');
  try {
    const price = await fetchPriceFromAPI(ticker, date);
    document.getElementById(priceFieldId).value = price.toFixed(2);
  } catch (e) {
    const el = document.getElementById(errFieldId);
    if (el) { el.textContent = e.message; el.classList.remove('hidden'); }
  } finally {
    loader.classList.add('hidden');
  }
}

async function onTickerBlur() {
  const ticker = document.getElementById('f-ticker').value.trim();
  const ideaDate    = document.getElementById('f-idea-date').value;
  const initialDate = document.getElementById('f-initial-date').value;
  await Promise.all([
    autoFetch('loading-idea',    'f-idea-price',    'err-idea-price',    ticker, ideaDate),
    autoFetch('loading-initial', 'f-initial-price', 'err-initial-price', ticker, initialDate),
  ]);
}

async function onIdeaDateBlur() {
  const ticker = document.getElementById('f-ticker').value.trim();
  const date   = document.getElementById('f-idea-date').value;
  await autoFetch('loading-idea', 'f-idea-price', 'err-idea-price', ticker, date);
}

async function onInitialDateBlur() {
  const ticker = document.getElementById('f-ticker').value.trim();
  const date   = document.getElementById('f-initial-date').value;
  await autoFetch('loading-initial', 'f-initial-price', 'err-initial-price', ticker, date);
}

async function submitIdea(e) {
  e.preventDefault();
  clearErrors();

  const ticker      = document.getElementById('f-ticker').value.trim();
  const ideaDate    = document.getElementById('f-idea-date').value;
  const initialDate = document.getElementById('f-initial-date').value;
  const thesis      = document.getElementById('f-thesis').value.trim();
  const direction   = document.querySelector('input[name="direction"]:checked').value;
  const assetClass  = document.getElementById('f-asset-class').value;
  const ideaPrice   = document.getElementById('f-idea-price').value;
  const initialPrice = document.getElementById('f-initial-price').value;

  let valid = true;
  if (!ticker)      { showErr('ticker', 'Required'); valid = false; }
  if (!ideaDate)    { showErr('idea-date', 'Required'); valid = false; }
  if (!initialDate) { showErr('initial-date', 'Required'); valid = false; }
  if (!thesis)      { showErr('thesis', 'Required'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  // Fetch current price before saving
  let currentPrice = null;
  if (assetClass === 'public_equity') {
    try { currentPrice = await fetchPriceFromAPI(ticker, 'today'); } catch {}
  }

  // Build multipart form so file uploads work
  const fd = new FormData();
  fd.append('ticker',       ticker);
  fd.append('idea_date',    ideaDate);
  fd.append('initial_date', initialDate);
  fd.append('thesis',       thesis);
  fd.append('direction',    direction);
  fd.append('asset_class',  assetClass);
  if (ideaPrice)            fd.append('idea_price',    ideaPrice);
  if (initialPrice)         fd.append('initial_price', initialPrice);
  if (currentPrice != null) fd.append('current_price', currentPrice);
  const sourceVal  = document.getElementById('f-source').value;
  if (sourceVal && sourceVal !== '__new__') fd.append('source_id', sourceVal);
  const hatTipVal = document.getElementById('f-hat-tip').value;
  if (hatTipVal) fd.append('hat_tip_id', hatTipVal);
  const rating   = document.getElementById('f-rating').value;
  if (rating)    fd.append('rating', rating);
  const ideaTypeVal = document.getElementById('f-idea-type').value;
  if (ideaTypeVal && ideaTypeVal !== '__new__') fd.append('idea_type_id', ideaTypeVal);
  const subtypeVal = document.getElementById('f-subtype').value;
  if (subtypeVal && subtypeVal !== '__new__') fd.append('subtype_id', subtypeVal);

  // Attachment — only send fields that changed (edit) or are provided (add)
  const clearAtt = editingId && document.getElementById('clear-attachment').checked;
  if (clearAtt) {
    fd.append('clear_attachment', 'true');
  } else {
    const attachType = document.querySelector('input[name="attach-type"]:checked').value;
    if (attachType === 'url') {
      const url = document.getElementById('f-attachment-url').value.trim();
      // In edit mode always send the key so backend knows to update it;
      // in add mode only send if non-empty
      if (editingId || url) fd.append('attachment_url', url);
    } else {
      const file = document.getElementById('f-attachment-file').files[0];
      if (file) {
        if (file.size > 20 * 1024 * 1024) {
          alert(`File "${file.name}" is ${(file.size / 1024 / 1024).toFixed(1)} MB — the limit is 20 MB. Please choose a smaller file.`);
          btn.disabled = false;
          btn.textContent = editingId ? 'Save Changes' : 'Add Idea';
          return;
        }
        fd.append('file', file);
      }
    }
  }

  try {
    const url    = editingId ? `/api/ideas/${editingId}` : '/api/ideas';
    const method = editingId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, body: fd });
    if (!res.ok) {
      const err = await res.json();
      alert(err.error || 'Failed to save idea');
      return;
    }
    const saved = await res.json();
    if (editingId) {
      ideas = ideas.map(i => i.id === editingId ? saved : i);
      render();
    } else {
      await loadIdeas();
    }
    closeModal();
  } finally {
    btn.disabled = false;
    btn.textContent = editingId ? 'Save Changes' : 'Add Idea';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([loadSources(), loadSubtypes(), loadIdeaTypes(), loadIdeas()]);
  const editId = new URLSearchParams(window.location.search).get('edit');
  if (editId) {
    window.history.replaceState({}, '', '/');
    openEditModal(parseInt(editId));
  }
})();
</script>
